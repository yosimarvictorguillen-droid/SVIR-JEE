<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar - SVIR (Alternativa 1)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/styles.css" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
    <div class="login-brand">
        <h1><i class="bi bi-cake2-fill"></i> SVIR</h1>
        <p class="fs-5">Sistema de Ventas e Inventario para Reposteria</p>
        <p class="opacity-75">Alternativa 1: panel administrativo clasico (Bootstrap + sidebar).</p>
    </div>
    <div class="login-form-side">
        <div class="login-card">
            <h3 class="mb-3">Ingresar</h3>
            <form onsubmit="event.preventDefault(); window.location='dashboard.html';">
                <div class="mb-3">
                    <label class="form-label">Correo electronico</label>
                    <input type="email" class="form-control" value="admin@dulcemomento.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <input type="password" class="form-control" value="********" required>
                </div>
                <button type="submit" class="btn btn-amber w-100">Ingresar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
