<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuevo producto - SVIR (Alternativa 1)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/styles.css" rel="stylesheet">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <span class="brand"><i class="bi bi-cake2-fill"></i> SVIR</span>
        <nav class="nav flex-column">
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="tabla.html"><i class="bi bi-box-seam"></i> Productos</a>
            <a class="active" href="formulario.html"><i class="bi bi-plus-square"></i> Nuevo producto</a>
            <a href="reportes.html"><i class="bi bi-bar-chart-line"></i> Reportes</a>
        </nav>
    </aside>
    <div class="main">
        <header class="topbar"><h5 class="mb-0">Nuevo producto</h5></header>
        <main class="content">
            <div class="card" style="max-width:600px;">
                <div class="card-body">
                    <form onsubmit="event.preventDefault(); alert('Prototipo estatico: no guarda datos.');">
                        <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" placeholder="Torta de chocolate"></div>
                        <div class="mb-3"><label class="form-label">Descripcion</label><textarea class="form-control" rows="2"></textarea></div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Precio (S/)</label><input type="number" class="form-control" value="45.00"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Stock</label><input type="number" class="form-control" value="8"></div>
                            <div class="col-md-4 mb-3"><label class="form-label">Stock minimo</label><input type="number" class="form-control" value="3"></div>
                        </div>
                        <button class="btn btn-amber">Guardar</button>
                        <a href="tabla.html" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
