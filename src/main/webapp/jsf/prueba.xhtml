<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Prueba JSF - SVIR-JEE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container py-4">
        <h1 class="h3 mb-3">Prueba de Jakarta Faces (JSF)</h1>

        <div class="alert alert-success">
            <strong>#{pruebaBean.mensaje}</strong><br/>
            Hora del servidor: #{pruebaBean.hora}<br/>
            Implementacion JSF: <code>#{pruebaBean.implementacionFaces}</code>
        </div>

        <h:form styleClass="row g-2 mb-4">
            <div class="col-auto">
                <h:inputText value="#{pruebaBean.nombre}" styleClass="form-control" a:placeholder="Tu nombre"
                             xmlns:a="jakarta.faces.passthrough"/>
            </div>
            <div class="col-auto">
                <h:commandButton value="Saludar (POST)" action="#{pruebaBean.saludar}" styleClass="btn btn-warning"/>
            </div>
            <div class="col-auto align-self-center">
                <h:outputText value="#{pruebaBean.saludo}" styleClass="fw-bold"/>
            </div>
        </h:form>

        <h2 class="h5">Productos activos (desde MySQL via ProductoDAO)</h2>
        <h:dataTable value="#{pruebaBean.productos}" var="p"
                     styleClass="table table-striped table-bordered bg-white">
            <h:column>
                <f:facet name="header">Producto</f:facet>
                #{p.nombre}
            </h:column>
            <h:column>
                <f:facet name="header">Precio (S/)</f:facet>
                #{p.precio}
            </h:column>
            <h:column>
                <f:facet name="header">Stock</f:facet>
                #{p.stock}
            </h:column>
        </h:dataTable>
    </div>
</h:body>
</html>
