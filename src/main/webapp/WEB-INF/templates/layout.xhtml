<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title><ui:insert name="titulo">SVIR-JEE</ui:insert> - Dulce Momento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="#{request.contextPath}/assets/css/jsf.css?v=#{applicationScope.iniciadoEn}" rel="stylesheet"/>
</h:head>
<h:body styleClass="svir-jsf">

    <!-- Barra de navegacion adaptativa (Bootstrap navbar): se colapsa en pantallas pequeñas -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-svir">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#{request.contextPath}/app/jsf/dashboard.xhtml">
                <img src="#{request.contextPath}/assets/img/logo-mark.svg" alt="Dulce Momento" width="28" height="28"/>
                SVIR-JEE <span class="badge bg-warning text-dark">JSF</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><h:link outcome="dashboard" value="Dashboard" styleClass="nav-link"/></li>
                    <li class="nav-item"><h:link outcome="productos" value="Productos" styleClass="nav-link"/></li>
                    <li class="nav-item"><a class="nav-link" href="#{request.contextPath}/app/dashboard">Panel anterior (JSP)</a></li>
                </ul>
                <span class="navbar-text me-3">
                    #{sessionScope.usuario.nombre}
                    <span class="badge bg-warning text-dark">#{sessionScope.usuario.rol}</span>
                </span>
                <h:form styleClass="d-flex">
                    <h:commandButton value="Salir" action="#{loginBean.salir}" styleClass="btn btn-outline-light btn-sm"/>
                </h:form>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <!-- Mensajes globales de JSF mostrados como alertas Bootstrap -->
        <h:messages globalOnly="true" layout="list" styleClass="list-unstyled"
                    infoClass="alert alert-success" warnClass="alert alert-warning"
                    errorClass="alert alert-danger" fatalClass="alert alert-danger"/>
        <ui:insert name="content"/>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
